name: gamification

services:
  database:
    image: postgres:16-alpine
    ports:
      - '127.0.0.1:${POSTGRES_PORT}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 2s
      timeout: 5s
      retries: 15

  ldap:
    build:
      context: ./docker/ldap
    ports:
      - '127.0.0.1:${LDAP_PORT}:389'
    environment:
      LDAP_ORGANISATION: Grywalizacja Local Labs
      LDAP_DOMAIN: labs.wmi.amu.edu.pl
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD}
      LDAP_CONFIG_PASSWORD: ${LDAP_CONFIG_PASSWORD}
      LDAP_TLS: 'false'
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'ldapsearch -x -H ldap://127.0.0.1:389 -b dc=labs,dc=wmi,dc=amu,dc=edu,dc=pl -D cn=admin,dc=labs,dc=wmi,dc=amu,dc=edu,dc=pl -w "$$LDAP_ADMIN_PASSWORD" >/dev/null',
        ]
      interval: 3s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - '${API_PORT}:3000'
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: 3000
    depends_on:
      database:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports:
      - '${WEB_PORT}:5173'
    environment:
      API_PROXY_TARGET: http://api:3000
    depends_on: [api]

volumes:
  postgres_data:
  ldap_data:
  ldap_config:
